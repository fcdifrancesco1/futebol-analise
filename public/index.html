<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Apuração — Estatísticas e Análise Tática</title>
  
  <!-- PWA & Mobile Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#07111E">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Apuração">
  <link rel="apple-touch-icon" href="https://media.api-sports.io/football/leagues/71.png">

  <!-- Fontes Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-wrapper">
    <!-- Topbar (Visível no PC e simplificada no Mobile) -->
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="#/">
          <span class="brand-crest">⚽</span>
          <span class="brand-name">APURAÇÃO</span>
        </a>
        
        <!-- Menu Desktop (Escondido no celular) -->
        <nav class="desktop-nav">
          <button class="tab active" data-nav="home">Ligas</button>
          <button class="tab" data-nav="live">Ao Vivo <span class="live-indicator"></span></button>
          <button class="tab" data-nav="compare">Comparador <span class="badge" id="compare-badge" hidden>0</span></button>
        </nav>

        <div class="quota-pill" id="quota-hint">⚡ Online</div>
      </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="main-content">
      <div id="app"></div>
    </main>

    <!-- Barra de Navegação Inferior Nativa (Visível APENAS no Celular) -->
    <nav class="mobile-bottom-nav">
      <button class="bottom-nav-item active" data-nav="home">
        <span class="bottom-nav-icon">🏆</span>
        <span class="bottom-nav-label">Ligas</span>
      </button>
      <button class="bottom-nav-item" data-nav="live">
        <span class="bottom-nav-icon">🔴</span>
        <span class="bottom-nav-label">Ao Vivo</span>
      </button>
      <button class="bottom-nav-item" data-nav="compare">
        <span class="bottom-nav-icon">⚡</span>
        <span class="bottom-nav-label">Comparador</span>
      </button>
    </nav>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
  <script>
    // Registro do Service Worker para PWA / APK
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }

    // Sincronização dos botões do Bottom Nav Mobile
    document.querySelectorAll(".bottom-nav-item").forEach(btn => {
      btn.addEventListener("click", () => {
        const nav = btn.dataset.nav;
        if (nav === "home") location.hash = "#/";
        if (nav === "live") location.hash = "#/aovivo";
        if (nav === "compare") location.hash = "#/compare";
      });
    });
  </script>
</body>
</html>
