<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b1720">
  <meta name="referrer" content="no-referrer">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>FutStats — Estatísticas e Análises de Futebol</title>
  
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=105">
  <link rel="stylesheet" href="/css/features.css?v=105">
  <link rel="stylesheet" href="/css/accessibility.css?v=105">
  <link rel="stylesheet" href="/css/redesign.css?v=108">
</head>
<body>
  <div class="app-wrapper">
    <!-- Topbar -->
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="#/" aria-label="FutStats, jogos do dia">
          <span class="brand-crest" aria-hidden="true">F</span>
          <span class="brand-name">Fut<span>Stats</span></span>
        </a>

        <nav class="desktop-nav" aria-label="Navegação Principal">
          <button class="tab active" data-nav="today">Jogos do Dia</button>
          <button class="tab" data-nav="live">Ao Vivo <span class="live-indicator"></span></button>
          <button class="tab" data-nav="home">Ligas & Copas</button>
          <button class="tab" data-nav="bolao">Bolão</button>
          <details class="desktop-more"><summary>Mais</summary><div class="more-links"><a href="#/minha-escalacao">Sua Escalação</a><a href="#/meu-time">Seu Time</a></div></details>
        </nav>

        <div style="display: flex; align-items: center; gap: 8px;">
          <!-- Botão do Time Favorito -->
          <button class="fav-team-header-btn" id="btn-fav-team-header" title="Seu Time Favorito">
            <span class="fav-team-label">⭐ Escolher Time</span>
          </button>

          <!-- Botão do Sininho no Topo -->
          <button class="btn-notification-bell" id="btn-open-notifications" title="Central de Notificações">
            <span class="bell-icon">🔔</span>
            <span class="bell-status-dot" id="bell-active-dot" hidden></span>
          </button>
          <span class="quota-pill" id="quota-hint">⚡ Conectado</span>
        </div>
      </div>
    </header>

    <div class="day-ticker" id="day-ticker" aria-label="Placar rápido" hidden><div class="day-ticker-inner" id="day-ticker-inner"></div></div>

    <!-- Conteúdo Principal -->
    <main class="main-content" id="app"></main>

    <!-- Menu Inferior Mobile -->
    <nav class="mobile-bottom-nav" aria-label="Navegação principal no celular">
      <button class="bottom-nav-item active" data-nav="today">
        <span class="bottom-nav-icon">📅</span>
        <span class="bottom-nav-label">Jogos</span>
      </button>
      <button class="bottom-nav-item" data-nav="live">
        <span class="bottom-nav-icon">●</span>
        <span class="bottom-nav-label">Ao Vivo</span>
      </button>
      <button class="bottom-nav-item" data-nav="home">
        <span class="bottom-nav-icon">🏆</span>
        <span class="bottom-nav-label">Ligas</span>
      </button>
      <details class="mobile-more"><summary><span class="bottom-nav-icon">☰</span><span class="bottom-nav-label">Mais</span></summary><div class="mobile-more-links"><a href="#/minha-escalacao" aria-label="Abrir sua escalação">Sua Escalação</a><a href="#/meu-time" aria-label="Abrir seu time">Seu Time</a><a href="#/bolao" aria-label="Abrir bolão">Bolão</a></div></details>
    </nav>
  </div>

  <!-- Janela Modal da Central de Notificações -->
  <div class="modal-backdrop" id="notif-modal-backdrop" hidden>
    <div class="notif-modal-card">
      <div class="notif-modal-header">
        <div style="display:flex;align-items:center;gap:8px;">
          <span style="font-size:1.4rem;">🔔</span>
          <h3 style="margin:0;font-size:1.1rem;font-weight:700;">Central de Notificações</h3>
        </div>
        <button class="btn-modal-close" id="btn-close-notifications">✕</button>
      </div>

      <div style="display:flex;flex-direction:column;gap:16px;">
        <!-- Chave Master -->
        <div class="notif-toggle-row">
          <div>
            <strong style="font-size:0.9rem;display:block;">Ativar Alertas Push</strong>
            <span style="font-size:0.75rem;color:var(--chalk-dim);">Receber gols mesmo com o app fechado</span>
          </div>
          <label class="switch">
            <input type="checkbox" id="toggle-notif-master">
            <span class="slider round"></span>
          </label>
        </div>

        <!-- Eventos Desejados -->
        <div>
          <label style="font-family:var(--font-mono);font-size:0.75rem;color:var(--gold);text-transform:uppercase;font-weight:700;display:block;margin-bottom:8px;">Eventos Desejados</label>
          <div class="notif-checkbox-grid">
            <label class="notif-checkbox-item"><input type="checkbox" id="pref-goals" checked> ⚽ Gols</label>
            <label class="notif-checkbox-item"><input type="checkbox" id="pref-lineups" checked> 📋 Escalações Confirmadas</label>
            <label class="notif-checkbox-item"><input type="checkbox" id="pref-kickoff" checked> ⏱️ Início de Jogo</label>
            <label class="notif-checkbox-item"><input type="checkbox" id="pref-halftime" checked> ⏸️ Intervalo</label>
            <label class="notif-checkbox-item"><input type="checkbox" id="pref-fulltime" checked> 🏁 Fim de Jogo</label>
            <label class="notif-checkbox-item"><input type="checkbox" id="pref-redcards" checked> 🟥 Cartões Vermelhos</label>
          </div>
        </div>

        <!-- Jogos Seguidos -->
        <div>
          <label style="font-family:var(--font-mono);font-size:0.75rem;color:var(--gold);text-transform:uppercase;font-weight:700;display:block;margin-bottom:8px;">Jogos Seguidos (Partidas Específicas)</label>
          <div class="notif-fav-fixtures-wrap" id="notif-fav-fixtures-list"></div>
        </div>

        <!-- Times Favoritos -->
        <div>
          <label style="font-family:var(--font-mono);font-size:0.75rem;color:var(--gold);text-transform:uppercase;font-weight:700;display:block;margin-bottom:8px;">Times Favoritos</label>
          <div class="notif-fav-search-wrap">
            <input type="text" id="notif-team-search" placeholder="Buscar time para seguir (ex: Flamengo, Vasco, Real Madrid...)" autocomplete="off">
            <div class="notif-team-results-box" id="notif-team-results" hidden></div>
          </div>
          <div class="notif-fav-pills-list" id="notif-fav-list"></div>
        </div>

        <!-- Botões de Ação & Teste -->
        <div style="display:flex;gap:10px;margin-top:6px;">
          <button class="btn ghost small" id="btn-test-notification" style="flex:1;">🔔 Testar Alerta</button>
          <button class="btn small" id="btn-save-notif" style="flex:1;">Salvar Ajustes</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true" hidden></div>

  <script defer src="/js/cache.js?v=105"></script>
  <script defer src="/js/models.js?v=105"></script>
  <script defer src="/js/core.js?v=105"></script>
  <script defer src="/js/notifications.js?v=108"></script>
  <script defer src="/js/shared-ui.js?v=105"></script>
  <script defer src="/js/favorite-team.js?v=105"></script>
  <script defer src="/js/leagues.js?v=105"></script>
  <script defer src="/js/players.js?v=105"></script>
  <script defer src="/js/teams.js?v=105"></script>
  <script defer src="/js/matches.js?v=108"></script>
  <script defer src="/js/fixture.js?v=108"></script>
  <script defer src="/js/comparison.js?v=105"></script>
  <script defer src="/js/lineups.js?v=105"></script>
  <script defer src="/js/broadcast.js?v=105"></script>
  <script defer src="/js/accessibility.js?v=105"></script>
  <script defer src="/js/bolao.js?v=105"></script>
  <script defer src="/app.js?v=106"></script>
</body>
</html>
