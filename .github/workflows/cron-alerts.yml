name: FutStats Manual Alert Check
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: futstats-manual-alerts
  cancel-in-progress: false
jobs:
  monitor-live-matches:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger authenticated alert check once
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://futebol-analise.vercel.app/api/cron-alerts"
